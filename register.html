<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-page">
    <!--navar-->
    <header class="navbar">
      <div class="logo">
        <span>+</span>
        Wedcare
      </div>
      <a href="index.html" class="back-home-btn"> -Back To Home </a>
    </header>
    <!--Register-->
    <main class="auth-container">
      <div class="auth-card">
        <div class="auth-icon">+</div>
        <span class="auth-level"> PATIENT ACCOUNT</span>
        <h1>Create Your Account</h1>
        <p class="auth-description">
          Register to book and manage your apponitments with Dr. Debanjana.
        </p>
        <form id="registerFrom">
          <!--Full name-->
          <div class="form-group">
            <label for="registerName">Full Name </label>
            <input
              type="text"
              id="registerName"
              placeholder="Enter your full name"
              required
            />
          </div>
          <!--Email-->
          <div class="form-group">
            <label for="registerEmail">Email Address </label>
            <input
              type="email"
              id="registerFrom"
              placeholder="Enter your email"
              required
            />
          </div>
          <!--phone-->
          <div class="form-group">
            <label for="registerPhone"> PhoneNo </label>
            <input
              type="tel"
              id="registerPhone"
              placeholder="Enter your phone number"
              required
            />
          </div>
          <!--password-->
          <div class="form-group">
            <label for="registerPassword"> Password </label>
            <div class="passsword-box">
              <input
                type="password"
                id="registerFrom"
                placeholder="Create a password"
                required
              />
              <button
                type="button"
                onclick="togglepassword('registerPassword', this)"
              >
                show
              </button>
            </div>
          </div>
          <!--Terms-->
          <label class="terms">
            <input type="checkbox" id="terms" required />
            <span>I agree tp the terms and privacy policy.</span>
          </label>
          <button type="submit" class="auth-submit">create Account</button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </div>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
